[package]
name = "stochastic-rs-ai"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "Neural-network surrogates for the Heston, Bergomi and rough Bergomi volatility models: fast implied-volatility surfaces and surrogate calibration in Rust (candle)."
homepage = "https://stochastic.rust-dd.com"
documentation = "https://docs.rs/stochastic-rs-ai"
repository = "https://github.com/rust-dd/stochastic-rs"
keywords = ["volatility", "neural-network", "finance", "quant", "surrogate"]
categories = ["finance", "mathematics", "science"]
exclude = ["tests/**"]

[features]
default = []
# Bridge feature: enables `StochVolNn::predict_implied_vol_surface` which
# packages a Nn prediction into a `stochastic_rs_quant::ImpliedVolSurface`.
quant = ["dep:stochastic-rs-quant"]
# Gates `volatility::common::write_surface_fit_plot_html`, the HTML fit-plot
# helper. Plotly is optional so a caller that only trains/predicts doesn't
# compile a plotting stack.
viz = ["dep:plotly"]
python = ["quant", "dep:pyo3", "dep:numpy", "dep:stochastic-rs-distributions", "stochastic-rs-distributions/python"]
# candle Metal back-end; `device::best_available` prefers a GPU it can reach at run time.
# CUDA is not a feature here: candle-kernels needs a CUDA toolkit to build, which the
# workspace-wide `--all-features` check cannot assume — enable `candle-core/cuda` in the
# consuming manifest instead.
metal = ["candle-core/metal", "candle-nn/metal"]

[dependencies]
anyhow = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
flate2 = { workspace = true }
ndarray = { workspace = true }
ndarray-npy = { workspace = true }
numpy = { workspace = true, optional = true }
plotly = { workspace = true, optional = true }
pyo3 = { workspace = true, features = ["extension-module"], optional = true }
rand = { workspace = true }
stochastic-rs-core = { workspace = true }
stochastic-rs-distributions = { workspace = true, optional = true }
stochastic-rs-quant = { workspace = true, optional = true }
