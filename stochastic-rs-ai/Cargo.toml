[package]
name = "stochastic-rs-ai"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "Experimental neural-network surrogates for the Heston, Bergomi and rough Bergomi volatility models: fast implied-volatility surfaces and surrogate calibration in Rust (candle)."
homepage = "https://stochastic.rust-dd.com"
documentation = "https://docs.rs/stochastic-rs-ai"
repository = "https://github.com/rust-dd/stochastic-rs"
keywords = ["volatility", "neural-network", "finance", "quant", "surrogate"]
categories = ["finance", "mathematics", "science"]
exclude = ["tests/**"]

[features]
default = []
# Enables predict_implied_vol_surface and the calibration module (SurrogateModel, the surrogate
# calibrators).
quant = ["dep:stochastic-rs-quant"]
# Gates write_surface_fit_plot_html so a train/predict-only build compiles no plotting stack.
viz = ["dep:plotly"]
python = ["quant", "dep:pyo3", "dep:numpy", "stochastic-rs-distributions/python"]
# candle's Metal back-end; CUDA stays in the consumer's manifest, since candle-kernels needs the
# toolkit at build time.
metal = ["candle-core/metal", "candle-nn/metal"]

[dependencies]
anyhow = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
flate2 = { workspace = true }
ndarray = { workspace = true }
ndarray-npy = { workspace = true }
numpy = { workspace = true, optional = true }
plotly = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
rand = { workspace = true }
stochastic-rs-core = { workspace = true }
stochastic-rs-distributions = { workspace = true }
stochastic-rs-quant = { workspace = true, optional = true }
