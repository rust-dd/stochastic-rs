[package]
name = "stochastic-rs-copulas"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "Copulas in Rust: 15 bivariate and 8 multivariate families — Clayton, Gumbel, Frank, Student-t, Gaussian, C-, D- and R-vines — with sampling, fitting and goodness-of-fit tests."
homepage = "https://stochastic.rust-dd.com"
documentation = "https://docs.rs/stochastic-rs-copulas"
repository = "https://github.com/rust-dd/stochastic-rs"
keywords = ["copula", "dependence", "statistics", "gaussian", "vine"]
categories = ["mathematics", "simulation", "science"]

[features]
default = []
python = [
    "dep:pyo3",
    "dep:numpy",
    "stochastic-rs-core/python",
    "stochastic-rs-distributions/python",
]

[dependencies]
faer = { workspace = true }
faer-ext = { workspace = true }
gauss-quad = { workspace = true }
kendalls = { workspace = true }
ndarray = { workspace = true }
numpy = { workspace = true, optional = true }
owens-t = { workspace = true }
pyo3 = { workspace = true, optional = true }
rand = { workspace = true }
stochastic-rs-core = { workspace = true }
stochastic-rs-distributions = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
