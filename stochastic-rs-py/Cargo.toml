[package]
name = "stochastic-rs-py"
version.workspace = true
edition = "2024"
license = "MIT"
readme = "README.md"
description = "Python (pyo3) bindings for stochastic-rs."
repository = "https://github.com/rust-dd/stochastic-rs"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
# Kept `false` deliberately: this crate forces `pyo3/extension-module`
# unconditionally (see `[dependencies]` below), which makes even `cargo
# build -p stochastic-rs-py` fail to link outside `maturin` (no libpython to
# resolve extension-module symbols against). `cargo test --doc` cannot build
# this crate's lib at all, on any platform, regardless of this flag — CI's
# doc-test step already excludes the package with `--exclude
# stochastic-rs-py` for the same reason. There are also zero fenced doc
# examples in its one source file today.
doctest = false

[features]
default = []
[dependencies]
stochastic-rs-core = { workspace = true, features = ["python"] }
stochastic-rs-distributions = { workspace = true, features = ["python"] }
stochastic-rs-stochastic = { workspace = true, features = ["python"] }
stochastic-rs-copulas = { workspace = true, features = ["python"] }
stochastic-rs-stats = { workspace = true, features = ["python"] }
stochastic-rs-quant = { workspace = true, features = ["python"] }
pyo3 = { workspace = true, features = ["extension-module"] }
numpy = { workspace = true }
ndarray = { workspace = true }
