[package]
name = "stochastic-rs-py"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "Python (pyo3) bindings for stochastic-rs."
repository = "https://github.com/rust-dd/stochastic-rs"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
# No doc examples here; the Python surface is tested by the pytest suite.
doctest = false

[features]
# Device back-ends of the stochastic crate (Euler engine `device=`, fGN samplers):
# `maturin develop --features metal` etc. Off in the published wheels.
metal = ["stochastic-rs-stochastic/metal"]
cuda = ["stochastic-rs-stochastic/cuda"]
accelerate = ["stochastic-rs-stochastic/accelerate"]
# Surrogates + surrogate calibration; off in the published wheels (candle is heavy):
# `maturin develop --features ai`.
ai = ["dep:stochastic-rs-ai"]
default = []

[dependencies]
ndarray = { workspace = true }
numpy = { workspace = true }
pyo3 = { workspace = true }
stochastic-rs-ai = { workspace = true, features = ["python"], optional = true }
stochastic-rs-copulas = { workspace = true, features = ["python"] }
stochastic-rs-core = { workspace = true, features = ["python"] }
stochastic-rs-distributions = { workspace = true, features = ["python"] }
stochastic-rs-quant = { workspace = true, features = ["python"] }
stochastic-rs-stats = { workspace = true, features = ["python"] }
stochastic-rs-stochastic = { workspace = true, features = ["python"] }
