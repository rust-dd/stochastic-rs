[workspace]
members = [
    "stochastic-rs-ai",
    "stochastic-rs-copulas",
    "stochastic-rs-core",
    "stochastic-rs-distributions",
    "stochastic-rs-py",
    "stochastic-rs-quant",
    "stochastic-rs-stats",
    "stochastic-rs-stochastic",
]

[workspace.package]
version = "3.0.0-rc.4"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0.89"
basin = { version = "1.11.0", default-features = false }
candle-core = "0.11.0"
candle-nn = "0.11.0"
chrono = "0.4.38"
criterion = { version = "0.8", features = ["html_reports"] }
cudarc = { version = "0.19.2", features = ["cuda-12080", "cuda-version-from-build-system"] }
faer = { version = "0.24.4", default-features = false, features = ["std", "rayon", "sparse-linalg"] }
faer-ext = { version = "0.8.0", features = ["ndarray"] }
flate2 = "1.1.2"
gauss-quad = "0.3.1"
implied-vol = "2.0.0"
kendalls = "1.0.0"
libm = "0.2.16"
linreg = "0.2.0"
log = "0.4.34"
metal = "0.33.0"
ndarray = { version = "0.17.2", features = ["rayon", "matrixmultiply-threading"] }
ndarray-npy = "0.10.0"
ndrustfft = "0.6.2"
num-complex = "0.4.6"
num-traits = "0.2.19"
numpy = "0.29"
ordered-float = "5.0.0"
owens-t = "0.1.5"
parking_lot = "0.12.5"
plotly = "0.14.1"
pyo3 = { version = "0.29.3", features = ["chrono"] }
quadrature = "0.1.2"
rand = "0.10.3"
rand_distr = "0.6.0"
rayon = "1.11.0"
roots = "0.0.8"
slsqp = "1.0.0"
# `statrs` is dev-deps only — used for cross-validating our closed-form
# `DistributionExt` impls. Production code never delegates to it.
statrs = "0.19.1"
stochastic-rs-ai = { path = "stochastic-rs-ai", version = "3.0.0-rc.4" }
stochastic-rs-copulas = { path = "stochastic-rs-copulas", version = "3.0.0-rc.4" }
stochastic-rs-core = { path = "stochastic-rs-core", version = "3.0.0-rc.4" }
stochastic-rs-distributions = { path = "stochastic-rs-distributions", version = "3.0.0-rc.4" }
stochastic-rs-quant = { path = "stochastic-rs-quant", version = "3.0.0-rc.4" }
stochastic-rs-stats = { path = "stochastic-rs-stats", version = "3.0.0-rc.4" }
stochastic-rs-stochastic = { path = "stochastic-rs-stochastic", version = "3.0.0-rc.4" }
syn = { version = "3.0.3", default-features = false, features = ["full", "parsing"] }
wide = "1.6.1"

[package]
name = "stochastic-rs"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Quantitative finance in Rust: 130+ stochastic processes, option pricing, model calibration, volatility surfaces, fixed income, risk and copulas — SIMD/GPU accelerated, with Python bindings."
homepage = "https://stochastic.rust-dd.com"
documentation = "https://docs.rs/stochastic-rs/latest/stochastic_rs/"
repository = "https://github.com/rust-dd/stochastic-rs"
readme = "README.md"
keywords = ["quantitative-finance", "option-pricing", "quantlib", "stochastic-processes", "monte-carlo"]
categories = ["finance", "mathematics", "science", "simulation", "algorithms"]
exclude = [ "**/*.tar.gz", "data/**", "trainsets/**", "notebooks/**", "src/ai/volatility/*TrainSet.txt.gz", ]

[dependencies]
chrono = { workspace = true }
cudarc = { workspace = true, optional = true }
ndarray = { workspace = true }
num-complex = { workspace = true }
num-traits = { workspace = true }
rand = { workspace = true }
stochastic-rs-ai = { workspace = true, optional = true }
stochastic-rs-copulas = { workspace = true }
stochastic-rs-core = { workspace = true }
stochastic-rs-distributions = { workspace = true }
stochastic-rs-quant = { workspace = true }
stochastic-rs-stats = { workspace = true }
stochastic-rs-stochastic = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
criterion = { workspace = true }
log = { workspace = true }
ndarray-npy = { workspace = true }
owens-t = { workspace = true }
plotly = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }

