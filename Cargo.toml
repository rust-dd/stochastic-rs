[features]
# Experimental: `stochastic-rs-ai` is outside the stability promise.
ai = ["dep:stochastic-rs-ai", "stochastic-rs-ai/quant"]
ai-metal = ["ai", "stochastic-rs-ai/metal"]
cuda = ["dep:cudarc", "cudarc/cufft", "stochastic-rs-stochastic/cuda"]
default = []
# Experimental dual-stream RNG engine (`SimdRngDual`): ~2–6 % faster bulk Normal fills on Apple
# Silicon; its seeded stream differs from `SimdRng`.
unstable-dual-stream-rng = [
    "stochastic-rs-core/unstable-dual-stream-rng",
    "stochastic-rs-distributions/unstable-dual-stream-rng",
]
accelerate = ["stochastic-rs-stochastic/accelerate"]
metal = ["stochastic-rs-stochastic/metal"]
# Plotly-backed HTML plotting: `stochastic-rs-quant`'s SABR-smile plotter and,
# when `ai` is also enabled, `stochastic-rs-ai`'s fit-plot helper. Uses a weak
# dependency feature (`stochastic-rs-ai?/viz`) so enabling `viz` alone does
# not pull in the (heavy, optional) `ai` sub-crate on its own.
viz = ["stochastic-rs-quant/viz", "stochastic-rs-ai?/viz"]

[lib]
name = "stochastic_rs"
crate-type = ["lib"]
path = "src/lib.rs"

[profile.release]
debug = false
codegen-units = 1
lto = true

[package.metadata.docs.rs]
# Avoid `all-features = true`: it pulls in native GPU SDKs (cudarc, metal), which do not build on docs.rs.
features = ["ai", "viz"]
rustdoc-args = ["--html-in-header", "docs/katex-header.html"]
