[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "stochastic-rs"
description = "Quantitative finance for Python, powered by Rust: 130+ stochastic processes, option pricing, model calibration, volatility surfaces, fixed income, risk and copulas — numpy-in / numpy-out."
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = ["numpy"]
readme = "stochastic-rs-py/README.md"
license = {text = "MIT"}
license-files = [
  "LICENSE",
  "stochastic-rs-distributions/LICENSE-THIRD-PARTY",
  "stochastic-rs-distributions/src/qmc/JOE_KUO_LICENSE",
  "stochastic-rs-quant/LICENSE-THIRD-PARTY",
]
keywords = [
  "quantitative-finance",
  "option-pricing",
  "quantlib",
  "stochastic-processes",
  "monte-carlo",
  "derivatives",
  "volatility",
  "heston",
  "calibration",
  "fixed-income",
  "risk-management",
  "copula",
  "sde",
  "rough-volatility",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Office/Business :: Financial",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "numpy", "scipy"]

[project.urls]
Homepage = "https://stochastic.rust-dd.com"
Documentation = "https://stochastic.rust-dd.com/docs/python"
Repository = "https://github.com/rust-dd/stochastic-rs"
Issues = "https://github.com/rust-dd/stochastic-rs/issues"
Changelog = "https://github.com/rust-dd/stochastic-rs/releases"

[tool.pytest.ini_options]
testpaths = ["stochastic-rs-py/tests"]
python_files = "test_*.py"
addopts = "-q"

# The module comes from the `stochastic-rs-py` cdylib, not the umbrella `lib`; `manifest-path`
# points maturin at it, so `maturin build` and `maturin develop` run from the workspace root.
[tool.maturin]
manifest-path = "stochastic-rs-py/Cargo.toml"
module-name = "stochastic_rs"
# No `features` pinned: the linear algebra is pure Rust (`faer`), so every platform builds the same
# wheel with no feature flags and no system BLAS.
