[package]
name = "stochastic-rs-core"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "SIMD random number generation and seed sources (deterministic and unseeded) for stochastic-rs, the quantitative-finance library for Rust."
homepage = "https://stochastic.rust-dd.com"
documentation = "https://docs.rs/stochastic-rs-core"
repository = "https://github.com/rust-dd/stochastic-rs"
keywords = ["stochastic", "simd", "rng", "monte-carlo", "simulation"]
categories = ["algorithms", "mathematics", "simulation"]

[features]
default = []
python = ["dep:ndarray"]
# Experimental `SimdRngDual` engine (two interleaved xoshiro streams); its seeded stream differs from `SimdRng`.
unstable-dual-stream-rng = []

[dependencies]
ndarray = { workspace = true, optional = true }
rand = { workspace = true }
wide = { workspace = true }
