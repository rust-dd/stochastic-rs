[package]
name = "stochastic-rs-stochastic"
version.workspace = true
edition = "2024"
license = "MIT"
readme = "README.md"
description = "Stochastic process simulation."
homepage = "https://stochastic.rust-dd.com"
documentation = "https://docs.rs/stochastic-rs-stochastic"
repository = "https://github.com/rust-dd/stochastic-rs"
keywords = ["stochastic", "simulation", "sde", "fbm", "monte-carlo"]
categories = ["mathematics", "simulation", "science"]

[features]
default = []
# CubeCL portable kernels: `cubecl` is the runtime-agnostic core, `cubecl-cuda` /
# `cubecl-wgpu` pick the runtime.
cubecl = ["dep:cubecl", "dep:gpu-fft"]
cubecl-cuda = ["cubecl", "dep:cubecl-cuda"]
cubecl-wgpu = ["cubecl", "dep:cubecl-wgpu"]
cuda-native = ["dep:cudarc", "cudarc/cufft"]
metal = ["dep:metal"]
accelerate = []
python = ["dep:pyo3", "dep:numpy", "stochastic-rs-core/python", "stochastic-rs-distributions/python"]

[dependencies]
faer = { workspace = true }
faer-ext = { workspace = true, features = ["ndarray"] }
stochastic-rs-core = { workspace = true }
stochastic-rs-distributions = { workspace = true }
ndarray = { workspace = true, features = ["rayon", "matrixmultiply-threading"] }
ndrustfft = { workspace = true }
num-complex = { workspace = true, features = ["rand"] }
num-traits = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
roots = { workspace = true }
kendalls = { workspace = true }
levenberg-marquardt = { workspace = true }
argmin = { workspace = true }
argmin-math = { workspace = true, features = ["ndarray_latest-nolinalg", "vec"] }
gauss-quad = { workspace = true }
quadrature = { workspace = true }
nalgebra = { workspace = true }
anyhow = { workspace = true }
wide = { workspace = true }
sci-rs = { workspace = true }
scilib = { workspace = true }
linreg = { workspace = true }
parking_lot = { workspace = true }
ordered-float = { workspace = true }
cubecl = { workspace = true, optional = true, default-features = false }
cubecl-cuda = { workspace = true, optional = true }
cubecl-wgpu = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true, features = ["cuda-12080", "cuda-version-from-build-system"] }
gpu-fft = { workspace = true, optional = true }
metal = { workspace = true, optional = true }
pyo3 = { workspace = true, features = ["extension-module"], optional = true }
numpy = { workspace = true, optional = true }

[dev-dependencies]
romu = { workspace = true }
