[package]
name = "stochastic-rs-stochastic"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "Simulate 130+ stochastic processes in Rust — Brownian motion, GBM, Heston, SABR, rough Bergomi, fractional Brownian motion, Lévy jumps, Hawkes, short-rate and LIBOR market models — on the CPU, CUDA or Metal."
homepage = "https://stochastic.rust-dd.com"
documentation = "https://docs.rs/stochastic-rs-stochastic"
repository = "https://github.com/rust-dd/stochastic-rs"
keywords = ["stochastic", "simulation", "sde", "fbm", "monte-carlo"]
categories = ["mathematics", "simulation", "science"]

[package.metadata.metal]
kernels = "../stochastic-rs-metal-kernels/Cargo.toml"

[features]
default = []
cuda = ["dep:cudarc", "cudarc/cufft", "dep:parking_lot"]
metal = ["dep:metal-oxide"]
accelerate = []
python = ["dep:pyo3", "dep:numpy", "stochastic-rs-core/python", "stochastic-rs-distributions/python"]

[dependencies]
cudarc = { workspace = true, optional = true }
faer = { workspace = true }
faer-ext = { workspace = true }
gauss-quad = { workspace = true }
log = { workspace = true }
ndarray = { workspace = true }
ndrustfft = { workspace = true }
num-complex = { workspace = true }
num-traits = { workspace = true }
numpy = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
rand = { workspace = true }
rayon = { workspace = true }
stochastic-rs-core = { workspace = true }
stochastic-rs-distributions = { workspace = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
metal-oxide = { workspace = true, optional = true }
