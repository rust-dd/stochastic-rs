name: PyPI Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the built wheels to PyPI"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHON_INTERPRETERS: python3.11 python3.12 python3.13 python3.14 python3.14t
  WHEEL_ABI_TAGS: cp311 cp312 cp313 cp314 cp314t

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
            manylinux: auto
          - runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: 2_28
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --out dist --interpreter ${{ env.PYTHON_INTERPRETERS }}
      - name: Check the wheel set
        shell: bash
        run: |
          diff -u -L built -L expected \
            <(printf '%s\n' dist/*.whl | sed -E 's|^dist/stochastic_rs-[^-]+-[^-]+-([^-]+)-.*|\1|' | sort) \
            <(tr ' ' '\n' <<< "$WHEEL_ABI_TAGS" | sort)
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.14t goes first: its bin dir ships a free-threaded python3.14, and
          # the version listed last is first on PATH, so it would shadow 3.14.
          python-version: |
            3.14t
            3.11
            3.12
            3.13
            3.14
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --locked --out dist --interpreter ${{ env.PYTHON_INTERPRETERS }}
      - name: Check the wheel set
        shell: bash
        run: |
          diff -u -L built -L expected \
            <(printf '%s\n' dist/*.whl | sed -E 's|^dist/stochastic_rs-[^-]+-[^-]+-([^-]+)-.*|\1|' | sort) \
            <(tr ' ' '\n' <<< "$WHEEL_ABI_TAGS" | sort)
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-aarch64
          path: dist

  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # One step per interpreter, passed by absolute path: letting maturin discover them would build
      # every CPython the runner image ships, a future 3.15 included.
      - uses: actions/setup-python@v5
        id: py311
        with:
          python-version: "3.11"
          architecture: x64
      - uses: actions/setup-python@v5
        id: py312
        with:
          python-version: "3.12"
          architecture: x64
      - uses: actions/setup-python@v5
        id: py313
        with:
          python-version: "3.13"
          architecture: x64
      - uses: actions/setup-python@v5
        id: py314
        with:
          python-version: "3.14"
          architecture: x64
      - uses: actions/setup-python@v5
        id: py314t
        with:
          python-version: "3.14t"
          architecture: x64
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: >-
            --release --locked --out dist --interpreter
            ${{ steps.py311.outputs.python-path }}
            ${{ steps.py312.outputs.python-path }}
            ${{ steps.py313.outputs.python-path }}
            ${{ steps.py314.outputs.python-path }}
            ${{ steps.py314t.outputs.python-path }}
      - name: Check the wheel set
        shell: bash
        run: |
          diff -u -L built -L expected \
            <(printf '%s\n' dist/*.whl | sed -E 's|^dist/stochastic_rs-[^-]+-[^-]+-([^-]+)-.*|\1|' | sort) \
            <(tr ' ' '\n' <<< "$WHEEL_ABI_TAGS" | sort)
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  smoke:
    needs: [linux, macos, windows]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: wheels-linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: wheels-linux-aarch64
          - os: macos-14
            artifact: wheels-macos-aarch64
          - os: windows-latest
            artifact: wheels-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install the built wheel and import it
        shell: bash
        run: |
          python -m pip install numpy
          python -m pip install --no-index --find-links dist --pre stochastic-rs
          python -c "import stochastic_rs as sr; import numpy as np; p = sr.PyGbm(mu=0.05, sigma=0.2, n=16, x0=1.0, seed=1); assert np.isfinite(p.sample()).all()"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist, smoke]
    if: github.event_name == 'release' || inputs.publish
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
