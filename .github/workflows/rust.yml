name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # A weekly run catches a new stable toolchain with no push to trigger it.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The 1.89 floor, per feature set: a dependency or a new std API that needs a newer compiler
  # shows in the leg that pulls it in.
  msrv:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - "--workspace --no-default-features --all-targets"
          - "-p stochastic-rs --all-targets"
          - "-p stochastic-rs --features ai"
          - "-p stochastic-rs --features viz"
          - "-p stochastic-rs --features unstable-dual-stream-rng"
          - "-p stochastic-rs-stochastic --features cuda"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Cargo check (MSRV, ${{ matrix.check }})
        run: cargo check ${{ matrix.check }} --locked

  # Every sub-crate compiles on its own with no default features, which catches a broken
  # inter-crate boundary before the umbrella jobs see it.
  check_subcrates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - stochastic-rs-core
          - stochastic-rs-distributions
          - stochastic-rs-stochastic
          - stochastic-rs-copulas
          - stochastic-rs-stats
          - stochastic-rs-quant
          - stochastic-rs-ai
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check (${{ matrix.crate }})
        run: cargo check -p ${{ matrix.crate }} --no-default-features --locked

  # Umbrella + features matrix. Covers feature combinations that exercise
  # cross-crate cfg-gated code.
  check_umbrella:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "" # default
          - "ai"
          - "viz"
          - "ai,viz"
          - "unstable-dual-stream-rng"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check (features=${{ matrix.features }})
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo check -p stochastic-rs --all-targets --locked
          else
            cargo check -p stochastic-rs --all-targets --features "${{ matrix.features }}" --locked
          fi

  # Lint + format gates. Catches drift independently of the feature matrix.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: Embedded Metal kernel sources
        run: cargo check -p stochastic-rs-stochastic --features metal --locked
        env:
          METAL_OXIDE_ARTIFACTS: locked
      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --no-default-features --all-targets --locked -- -D warnings
      # The library crates deny `rustdoc::broken_intra_doc_links`, and this is the one step that
      # runs rustdoc: the doctest gate does not exercise that lint.
      - name: cargo doc (intra-doc links, deny warnings)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Cargo check (stochastic-rs-py, features=ai)
        run: cargo check -p stochastic-rs-py --features ai --locked

  # The one macOS job: the Apple back-ends compile only there, so it checks that they keep
  # compiling, without running the GPU.
  check_macos_backends:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check (metal + accelerate)
        run: cargo check -p stochastic-rs-stochastic --features metal,accelerate --all-targets --locked
      - name: Cargo check (python + metal + accelerate)
        run: cargo check -p stochastic-rs-py --features metal,accelerate --all-targets --locked
      - name: Device handle environment contract (metal)
        run: cargo test -p stochastic-rs-stochastic --features metal --test device_handle_env --locked

  # Off macOS the Apple back-ends are inert: their features compile the crates without them.
  check_apple_features_inert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check (metal + accelerate on Linux)
        run: cargo check -p stochastic-rs --features metal,accelerate --all-targets --locked
      - name: Cargo check (stochastic, metal + accelerate on Linux)
        run: cargo check -p stochastic-rs-stochastic --features metal,accelerate --all-targets --locked
      - name: Cargo check (python + metal + accelerate on Linux)
        run: cargo check -p stochastic-rs-py --features metal,accelerate --all-targets --locked

  # cudarc loads libcuda at run time, so the CUDA back-end compiles without a GPU or toolkit (the
  # cuda-12080 pin stands in for nvcc); cuda.yml runs the kernels on the GPU runner.
  check_cuda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cargo check (cuda)
        run: cargo check -p stochastic-rs-stochastic --features cuda --all-targets --locked
      - name: Clippy (cuda)
        run: cargo clippy -p stochastic-rs-stochastic --features cuda --all-targets --locked -- -D warnings
      - name: Cargo check (python + cuda)
        run: cargo check -p stochastic-rs-py --features cuda --all-targets --locked
      - name: Device handle environment contract (cuda)
        run: cargo test -p stochastic-rs-stochastic --features cuda --test device_handle_env --locked

  # Every published crate's documentation on a pinned nightly with `docsrs` set, as docs.rs builds it.
  docs_rs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: stochastic-rs-core, features: "" }
          - { crate: stochastic-rs-distributions, features: "" }
          - { crate: stochastic-rs-stochastic, features: "" }
          - { crate: stochastic-rs-copulas, features: "" }
          - { crate: stochastic-rs-stats, features: "" }
          - { crate: stochastic-rs-quant, features: "" }
          - { crate: stochastic-rs-ai, features: "" }
          - { crate: stochastic-rs, features: "ai,viz" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-11-11
      - name: cargo doc (${{ matrix.crate }}, docsrs)
        run: cargo doc -p ${{ matrix.crate }} --no-deps --features "${{ matrix.features }}" --locked
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  # Every feature on its own; the Apple-only ones are left out, since candle's Metal needs objc2.
  check_each_feature:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: cargo hack --each-feature check
        run: cargo hack check --workspace --exclude stochastic-rs-py --each-feature --exclude-all-features --exclude-features metal,ai-metal,accelerate --locked

  # Every feature but the Apple-only ones: candle's Metal needs objc2, which fails off Apple targets.
  clippy_all_features:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (workspace, every non-Apple feature)
        run: >-
          cargo clippy --workspace --all-targets --locked --features stochastic-rs/ai,stochastic-rs/viz,stochastic-rs/cuda,stochastic-rs/unstable-dual-stream-rng,stochastic-rs-ai/quant,stochastic-rs-ai/viz,stochastic-rs-ai/python,stochastic-rs-quant/python,stochastic-rs-quant/viz,stochastic-rs-copulas/python,stochastic-rs-core/python,stochastic-rs-distributions/python,stochastic-rs-stats/python,stochastic-rs-stochastic/python,stochastic-rs-py/ai,stochastic-rs-py/cuda -- -D warnings

  # Windows and macOS run the fast suite; they stay advisory until a first run says which tests
  # are platform-bound.
  test_platforms:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # The exact stream hashes are pinned on one machine's libm, so they run in the local gates;
      # the distributions' close twins run here.
      - name: cargo nextest run (workspace)
        run: >-
          cargo nextest run --workspace --exclude stochastic-rs-py --profile ci --locked
          -E 'not (binary(stream_snapshots) & (test(/::exact$/) | test(=seeded_copula_streams_are_pinned)))'

  # The MDX pages render `tests/doctest_*.rs` by path; this build catches a dangling or renamed one
  # and is the only job that looks inside `website/`.
  docs_website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: bun install
        run: bun install
      - name: ESLint (next/core-web-vitals)
        run: bun run lint
      - name: Frontmatter + RustExample path audit
        run: bun run audit
      - name: Full site build (resolves every RustExample and internal link)
        run: bun run build

  # Builds the cdylib with `maturin develop` and exercises the five API surfaces, the seeded
  # samplers' determinism included.
  python_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # `maturin develop` needs a virtualenv, which the runner lacks; each step calls the venv's
      # binaries directly, since a `source` would not outlive its own `run:` shell.
      - name: Set up venv + install build deps
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install maturin numpy pytest scipy
      - name: maturin develop
        run: .venv/bin/maturin develop --release --locked
      - name: Run python_smoke.py
        # `-u` flushes the last `[OK]`/`[FAIL]` line before a crash into the log; `-X faulthandler`
        # prints the C and Python traceback of a SIGSEGV.
        run: .venv/bin/python -X faulthandler -u stochastic-rs-py/python_smoke.py
      - name: Run pytest suite
        # The pytest suite covers the five API surfaces beyond the smoke script; conftest.py skips
        # with a message if the extension does not import.
        run: .venv/bin/python -m pytest stochastic-rs-py/tests/ -v

  # The fast gate: the workspace suite under nextest without instrumentation, so a failing test
  # shows in minutes; the `ci` profile prints a running `(N/total)`.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # A debug build on the coverage job's features, which the tests' wall-clock bounds are sized
      # for; `stochastic-rs-py` is left to the python_smoke job's pytest.
      - name: cargo nextest run (workspace)
        run: cargo nextest run --workspace --exclude stochastic-rs-py --profile ci --locked
      # The workspace run leaves quant and viz off; they gate the ai crate's
      # calibration, Heston-pin and plot tests.
      - name: cargo nextest run (ai surrogates, quant and viz)
        run: cargo nextest run -p stochastic-rs-ai --features quant,viz --profile ci --locked
      # `unstable-dual-stream-rng` is off in the workspace run; with it the pinning test covers the
      # ziggurats' 16-lane step and the dual engine's uninit stores.
      - name: cargo nextest run (fill pinning test, dual-stream engine)
        run: cargo nextest run -p stochastic-rs-distributions --features unstable-dual-stream-rng --test fill_writes_every_element --profile ci --locked
      # nextest runs no doctests; this gates the doc examples, the README quickstart included.
      # Release: the Monte Carlo examples are too slow unoptimised; LTO only slows the rebuild.
      - name: cargo test --doc (workspace)
        run: cargo test --release --workspace --exclude stochastic-rs-py --doc --locked
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

  # Full test run with coverage. Heavyweight + instrumented, so it
  # only runs on pushes to main; the fast `test` job gates pull requests.
  test_with_coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      # nightly-2026-07-25 (rustc da86f4d07) ICEs in rustc_codegen_ssa on `tokio` under coverage, so
      # this pins the last good one, nightly-2026-07-22, until upstream fixes it.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-22
          components: llvm-tools-preview

      - name: Add llvm-tools to PATH
        run: echo "${HOME}/.rustup/toolchains/$(rustup show active-toolchain | cut -d' ' -f1)/bin" >> "$GITHUB_PATH"

      - name: Install grcov
        run: cargo install grcov

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Clean Build Artifacts
        run: cargo clean

      - name: Run tests with coverage
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_DEBUG: "1"
          RUSTFLAGS: "-C instrument-coverage"
          LLVM_PROFILE_FILE: "coverage-%p-%m.profraw"
        # nextest runs each test in its own process, one profraw each, kept unique by `%p` above;
        # grcov merges them all.
        run: |
          cargo nextest run --release --workspace --exclude stochastic-rs-py --profile ci-coverage --locked

      - name: Generate coverage report
        run: |
          grcov . \
            --binary-path ./target/release/ \
            -s . \
            -t lcov \
            --branch \
            --ignore-not-existing \
            --llvm \
            -o lcov.info
          # grcov has merged the ~1300 profraw files (over 1 GB) into lcov.info, and the Codecov
          # upload would otherwise sweep them up instead of the one report it can parse.
          find . -name '*.profraw' -delete

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          # Upload only lcov.info; do not let the CLI discover/attach anything
          # else in the tree (belt-and-braces with the profraw cleanup above).
          disable_search: true
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
