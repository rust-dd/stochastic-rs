[package]
name = "stochastic-rs-stats"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "Statistics for stochastic processes in Rust: Hurst exponent estimators, maximum likelihood for diffusions, Heston MLE, GARCH fitting, realised volatility, unit-root and cointegration tests."
homepage = "https://stochastic.rust-dd.com"
documentation = "https://docs.rs/stochastic-rs-stats"
repository = "https://github.com/rust-dd/stochastic-rs"
keywords = ["statistics", "estimation", "hurst", "mle", "stochastic"]
categories = ["mathematics", "science"]

[features]
default = []
python = [
    "dep:pyo3",
    "dep:numpy",
    "stochastic-rs-core/python",
    "stochastic-rs-distributions/python",
    "stochastic-rs-stochastic/python",
]

[dependencies]
basin = { workspace = true }
faer = { workspace = true }
faer-ext = { workspace = true }
linreg = { workspace = true }
ndarray = { workspace = true }
ndrustfft = { workspace = true }
num-complex = { workspace = true }
numpy = { workspace = true, optional = true }
parking_lot = { workspace = true }
pyo3 = { workspace = true, optional = true }
rand = { workspace = true }
rand_distr = { workspace = true }
stochastic-rs-core = { workspace = true }
stochastic-rs-distributions = { workspace = true }
stochastic-rs-stochastic = { workspace = true }
