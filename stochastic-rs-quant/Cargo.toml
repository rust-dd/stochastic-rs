[package]
name = "stochastic-rs-quant"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "Option pricing and model calibration in Rust: Black-Scholes, Heston, SABR, rough Bergomi and Lévy models, SVI/SSVI volatility surfaces, Greeks, yield curves, bonds, credit and XVA."
homepage = "https://stochastic.rust-dd.com"
documentation = "https://docs.rs/stochastic-rs-quant"
repository = "https://github.com/rust-dd/stochastic-rs"
keywords = ["quant", "finance", "pricing", "options", "calibration"]
categories = ["finance", "mathematics", "simulation"]

[features]
default = []
python = [
    "dep:pyo3",
    "dep:numpy",
    "stochastic-rs-core/python",
    "stochastic-rs-distributions/python",
    "stochastic-rs-stochastic/python",
    "stochastic-rs-stats/python",
    "stochastic-rs-copulas/python",
]
# Gates the SABR-smile HTML plotter (`SabrSmileCalibrator::plot`,
# `calibrate_and_plot_many`'s chart output). Plotly is optional so a caller
# that only calibrates doesn't compile a plotting stack.
viz = ["dep:plotly"]

[dependencies]
faer = { workspace = true }
faer-ext = { workspace = true, features = ["ndarray"] }
stochastic-rs-core = { workspace = true }
stochastic-rs-distributions = { workspace = true }
stochastic-rs-stochastic = { workspace = true }
stochastic-rs-stats = { workspace = true }
stochastic-rs-copulas = { workspace = true }
ndarray = { workspace = true, features = ["rayon", "matrixmultiply-threading"] }
ndarray-npy = { workspace = true }
ndrustfft = { workspace = true }
num-traits = { workspace = true }
num-complex = { workspace = true, features = ["rand"] }
rand = { workspace = true }
rayon = { workspace = true }
roots = { workspace = true }
kendalls = { workspace = true }
linreg = { workspace = true }
basin = { workspace = true, features = ["ndarray_v0_17"] }
gauss-quad = { workspace = true }
quadrature = { workspace = true }
slsqp = { workspace = true }
implied-vol = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
anyhow = { workspace = true }
ordered-float = { workspace = true }
plotly = { workspace = true, features = ["plotly_ndarray"], optional = true }
flate2 = { workspace = true }
owens-t = { workspace = true }
wide = { workspace = true }
pyo3 = { workspace = true, features = ["extension-module"], optional = true }
numpy = { workspace = true, optional = true }

[dev-dependencies]
syn = { workspace = true }
